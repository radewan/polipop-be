[project]
name = "polipop-be"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "aiomysql>=0.3.2",
    "alembic>=1.20.1",
    "fastapi[standard]>=0.165.0",
    "pillow>=13.0.0",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "sqlalchemy[asyncio]>=2.1.9",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]
